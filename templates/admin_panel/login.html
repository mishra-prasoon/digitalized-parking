<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Login — SmartPark</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body style="background:#1a1a2e;min-height:100vh;display:flex;align-items:center">
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-4">
            <div class="text-center mb-4">
                <i class="bi bi-shield-lock-fill text-primary" style="font-size:3rem"></i>
                <h3 class="text-white fw-bold mt-2">Admin Panel</h3>
                <p class="text-muted">SmartPark Staff Access</p>
            </div>
            <div class="card p-4" style="border-radius:16px">
                {% if messages %}
                {% for msg in messages %}
                <div class="alert alert-danger">{{ msg }}</div>
                {% endfor %}
                {% endif %}
                <form method="POST">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Username</label>
                        <input type="text" name="username" class="form-control form-control-lg"
                               placeholder="Admin username" required autofocus>
                    </div>
                    <div class="mb-4">
                        <label class="form-label fw-semibold">Password</label>
                        <input type="password" name="password" class="form-control form-control-lg"
                               placeholder="Password" required>
                    </div>
                    <button type="submit" class="btn btn-primary btn-lg w-100">
                        <i class="bi bi-shield-lock me-2"></i>Login as Admin
                    </button>
                </form>
            </div>
            <div class="text-center mt-3">
                <a href="/" class="text-muted small">← Back to main site</a>
            </div>
        </div>
    </div>
</div>
</body>
</html>
