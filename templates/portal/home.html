{% extends "base.html" %}
{% block content %}
<h2>👋 Welcome, {{ user.username }}</h2>
<p>Manage your vehicles, bookings, and parking history from here.</p>

<div class="topnav-links">
  <a href="{% url 'my_bookings' %}">📋 My Bookings</a>
  <a href="{% url 'create_booking' %}">➕ Book a Slot</a>
  <a href="{% url 'add_vehicle' %}">🚙 Add Vehicle</a>
</div>

<form method="post" action="{% url 'logout' %}" style="margin-top:24px;">
  {% csrf_token %}
  <button type="submit" style="background:var(--red);">Logout</button>
</form>
{% endblock %}
