{% extends "base.html" %}
{% block content %}
<h2>💳 Exit Kiosk</h2>

<div style="display:flex; gap:24px; flex-wrap:wrap; align-items:flex-start;">
  <div>
    <video id="video" width="340" height="255" autoplay style="border:2px solid var(--border); background:#111;"></video>
    <canvas id="canvas" width="340" height="255" style="display:none;"></canvas>
    <div style="margin-top:12px;">
      <button id="captureBtn" type="button">📸 Capture from Camera</button>
      <div style="margin-top:10px; font-size:13px; color:var(--muted);">or upload a photo instead:</div>
      <input type="file" id="fileInput" accept="image/*" style="margin-top:6px;">
    </div>
  </div>

  <div style="flex:1; min-width:260px;">
    <div id="manualEntry" style="background:#f9fafb; border:1px solid var(--border); border-radius:10px; padding:16px; margin-bottom:16px;">
      <p style="margin:0 0 8px; font-weight:600;">Or enter plate manually:</p>
      <input type="text" id="manualPlate" placeholder="e.g. UP65AB1234">
      <br>
      <button id="manualSubmit" type="button" style="margin-top:10px;">Scan for Exit</button>
    </div>

    <div id="result" style="background:#f9fafb; border:1px solid var(--border); border-radius:10px; padding:20px; min-height:60px; font-size:17px;">
      Waiting for a vehicle...
    </div>
  </div>
</div>

<p style="margin-top:28px;"><a href="{% url 'staff_dashboard' %}">← Back to Dashboard</a></p>

<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<script>
const CSRF_TOKEN = '{{ csrf_token }}';
const RAZORPAY_KEY_ID = '{{ razorpay_key_id }}';

navigator.mediaDevices.getUserMedia({ video: true })
  .then(s => { document.getElementById('video').srcObject = s; })
  .catch(err => {
    document.getElementById('result').innerText =
      'Camera unavailable: ' + err.message + ' (use file upload or manual entry)';
  });

function showMessage(text, color) {
  document.getElementById('result').innerHTML = '<span style="color:' + (color || 'inherit') + '; font-weight:600;">' + text + '</span>';
}

function showPaymentFallback(data) {
  document.getElementById('result').innerHTML =
    '<div style="color:#9a3412; font-weight:600;">⚠️ Online payment is unavailable right now.</div>' +
    '<div style="margin-top:6px; color:var(--muted); font-size:13px;">' + (data.payment_error || '') + '</div>' +
    '<div style="margin-top:14px;">Plate: <strong>' + data.plate + '</strong> &nbsp;|&nbsp; Fee: <strong>₹' + data.fee + '</strong></div>' +
    '<div style="margin-top:14px;">' +
    '<button id="retryPayBtn" type="button">🔁 Retry Online Payment</button> ' +
    '<button id="payCashBtn" type="button" style="background:var(--green); margin-left:8px;">💵 Pay with Cash</button>' +
    '</div>';

  document.getElementById('retryPayBtn').addEventListener('click', () => {
    const formData = new FormData();
    formData.append('transaction_id', data.transaction_id);
    fetch('{% url "exit_retry_payment" %}', {
      method: 'POST',
      headers: { 'X-CSRFToken': CSRF_TOKEN },
      body: formData,
    })
      .then(r => r.json())
      .then(retryData => {
        if (retryData.payment_unavailable) {
          showPaymentFallback(retryData);
        } else if (retryData.razorpay_order_id) {
          showMessage('Plate: ' + retryData.plate + ' | Fee: ₹' + retryData.fee + ' | Opening payment...');
          openCheckout(retryData);
        } else {
          showMessage('❌ ' + (retryData.error || 'Retry failed'), 'var(--red)');
        }
      })
      .catch(err => showMessage('Retry failed: ' + err, 'var(--red)'));
  });

  document.getElementById('payCashBtn').addEventListener('click', () => {
    const formData = new FormData();
    formData.append('transaction_id', data.transaction_id);
    fetch('{% url "exit_confirm_cash" %}', {
      method: 'POST',
      headers: { 'X-CSRFToken': CSRF_TOKEN },
      body: formData,
    })
      .then(r => r.json())
      .then(resp => {
        if (resp.error) {
          showMessage('❌ ' + resp.error, 'var(--red)');
        } else {
          showMessage('✅ Cash payment recorded. Slot freed. 🚧 Barrier opening...', 'var(--green)');
        }
      })
      .catch(err => showMessage('Request failed: ' + err, 'var(--red)'));
  });
}

function openCheckout(scanData) {
  const options = {
    key: RAZORPAY_KEY_ID,
    amount: scanData.amount_paise,
    currency: 'INR',
    name: 'Parking Exit Payment',
    description: 'Plate: ' + scanData.plate + ' | Fee: Rs.' + scanData.fee,
    order_id: scanData.razorpay_order_id,
    handler: function (response) {
      const formData = new FormData();
      formData.append('transaction_id', scanData.transaction_id);
      formData.append('razorpay_order_id', response.razorpay_order_id);
      formData.append('razorpay_payment_id', response.razorpay_payment_id);
      formData.append('razorpay_signature', response.razorpay_signature);

      fetch('{% url "exit_confirm_payment" %}', {
        method: 'POST',
        headers: { 'X-CSRFToken': CSRF_TOKEN },
        body: formData,
      })
        .then(r => r.json())
        .then(data => {
          if (data.error) {
            showMessage('❌ Payment verification failed: ' + data.error, 'var(--red)');
          } else {
            showMessage('✅ Payment confirmed. Slot freed. 🚧 Barrier opening...', 'var(--green)');
          }
        })
        .catch(err => showMessage('Confirm request failed: ' + err, 'var(--red)'));
    },
    modal: {
      ondismiss: function () {
        showMessage('⚠️ Payment cancelled. Please retry payment for plate ' + scanData.plate + '.', '#9a3412');
      }
    },
    theme: { color: '#2563eb' }
  };
  const rzp = new Razorpay(options);
  rzp.open();
}

function sendScan(formData) {
  fetch('{% url "exit_scan" %}', {
    method: 'POST',
    headers: { 'X-CSRFToken': CSRF_TOKEN },
    body: formData,
  })
    .then(r => r.json())
    .then(data => {
      if (data.error) {
        showMessage('❌ Error: ' + data.error + (data.plate ? ' (plate: ' + data.plate + ')' : ''), 'var(--red)');
      } else if (!data.plate) {
        showMessage(data.message || 'No plate detected. Enter manually.');
      } else if (data.payment_unavailable) {
        showPaymentFallback(data);
      } else if (data.razorpay_order_id) {
        showMessage('Plate: ' + data.plate + ' | Fee: ₹' + data.fee + ' | Opening payment...');
        openCheckout(data);
      }
    })
    .catch(err => showMessage('Request failed: ' + err, 'var(--red)'));
}

document.getElementById('captureBtn').addEventListener('click', () => {
  const video = document.getElementById('video');
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  const blobs = [];
  let count = 0;

  function grabFrame() {
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
    canvas.toBlob(blob => {
      blobs.push(blob);
      count++;
      if (count < 3) {
        setTimeout(grabFrame, 300);
      } else {
        const formData = new FormData();
        blobs.forEach((b, i) => formData.append('images', b, 'frame' + i + '.jpg'));
        sendScan(formData);
      }
    }, 'image/jpeg');
  }
  grabFrame();
});

document.getElementById('fileInput').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (file) {
    const formData = new FormData();
    formData.append('images', file);
    sendScan(formData);
  }
});

document.getElementById('manualSubmit').addEventListener('click', () => {
  const plate = document.getElementById('manualPlate').value.trim();
  if (!plate) return;
  const formData = new FormData();
  formData.append('manual_plate', plate);
  sendScan(formData);
});
</script>
{% endblock %}
