{% extends "base.html" %}
{% block content %}
<h2>🚗 Entry Gate</h2>

<div style="display:flex; gap:24px; flex-wrap:wrap; align-items:flex-start;">
  <div>
    <video id="video" width="340" height="255" autoplay style="border:2px solid var(--border); background:#111;"></video>
    <canvas id="canvas" width="340" height="255" style="display:none;"></canvas>
    <div style="margin-top:12px;">
      <button id="captureBtn" type="button">📸 Capture from Camera</button>
      <div style="margin-top:10px; font-size:13px; color:var(--muted);">or upload a photo instead:</div>
      <input type="file" id="fileInput" accept="image/*" style="margin-top:6px;">
    </div>
  </div>

  <div style="flex:1; min-width:260px;">
    <div id="result" style="background:#f9fafb; border:1px solid var(--border); border-radius:10px; padding:20px; min-height:80px; font-size:17px;">
      Waiting for a vehicle...
    </div>

    <div id="manualEntry" style="display:none; margin-top:16px; background:#fff7ed; border:1px solid #fed7aa; border-radius:10px; padding:16px;">
      <p style="margin:0 0 8px; color:#9a3412; font-weight:600;">⚠️ No plate detected. Enter manually:</p>
      <input type="text" id="manualPlate" placeholder="e.g. UP65AB1234">
      <br>
      <button id="manualSubmit" type="button" style="margin-top:10px;">Check In</button>
    </div>
  </div>
</div>

<p style="margin-top:28px;"><a href="{% url 'staff_dashboard' %}">← Back to Dashboard</a></p>

<script>
const CSRF_TOKEN = '{{ csrf_token }}';

navigator.mediaDevices.getUserMedia({ video: true })
  .then(s => { document.getElementById('video').srcObject = s; })
  .catch(err => {
    document.getElementById('result').innerText =
      'Camera unavailable: ' + err.message + ' (use file upload instead)';
  });

function showResult(data) {
  const el = document.getElementById('result');
  const manualBox = document.getElementById('manualEntry');
  if (data.error) {
    el.innerHTML = '<span style="color:var(--red); font-weight:600;">❌ ' + data.error + '</span>' + (data.plate ? '<br><span style="color:var(--muted); font-size:14px;">Plate: ' + data.plate + '</span>' : '');
    manualBox.style.display = 'none';
  } else if (!data.plate) {
    el.innerText = data.message || 'No plate detected.';
    manualBox.style.display = 'block';
  } else if (data.slot_id) {
    el.innerHTML = '<div style="color:var(--green); font-weight:700; font-size:20px;">✅ Plate: ' + data.plate + '</div>' +
      '<div style="margin-top:8px;">Slot assigned: <strong style="font-size:22px; color:var(--primary);">' + data.slot_id + '</strong></div>' +
      '<div style="margin-top:8px; color:var(--muted);">🚧 Barrier opening...</div>';
    manualBox.style.display = 'none';
  }
}

function sendImages(blobs) {
  const formData = new FormData();
  blobs.forEach((b, i) => formData.append('images', b, 'frame' + i + '.jpg'));
  fetch('{% url "entry_check_in" %}', {
    method: 'POST',
    headers: { 'X-CSRFToken': CSRF_TOKEN },
    body: formData,
  })
    .then(r => r.json())
    .then(showResult)
    .catch(err => { document.getElementById('result').innerText = 'Request failed: ' + err; });
}

document.getElementById('captureBtn').addEventListener('click', () => {
  const video = document.getElementById('video');
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  const blobs = [];
  let count = 0;

  function grabFrame() {
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
    canvas.toBlob(blob => {
      blobs.push(blob);
      count++;
      if (count < 3) {
        setTimeout(grabFrame, 300);
      } else {
        sendImages(blobs);
      }
    }, 'image/jpeg');
  }
  grabFrame();
});

document.getElementById('fileInput').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (file) sendImages([file]);
});

document.getElementById('manualSubmit').addEventListener('click', () => {
  const plate = document.getElementById('manualPlate').value.trim();
  if (!plate) return;
  const formData = new FormData();
  formData.append('manual_plate', plate);
  fetch('{% url "entry_check_in" %}', {
    method: 'POST',
    headers: { 'X-CSRFToken': CSRF_TOKEN },
    body: formData,
  })
    .then(r => r.json())
    .then(showResult)
    .catch(err => { document.getElementById('result').innerText = 'Request failed: ' + err; });
});
</script>
{% endblock %}
