<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entry Gate — SmartPark</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: #0a0a1a;
            color: white;
            font-family: 'Segoe UI', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .gate-header {
            background: #1565C0;
            padding: 16px 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .status-screen {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            padding: 40px;
        }
        .plate-display {
            font-size: 5rem;
            font-weight: 900;
            letter-spacing: 8px;
            background: #ffc107;
            color: #000;
            padding: 20px 60px;
            border-radius: 16px;
            border: 4px solid #ff9800;
            font-family: monospace;
        }
        .slot-display {
            font-size: 8rem;
            font-weight: 900;
            color: #00e676;
        }
        .status-ready { color: #64b5f6; }
        .status-success { color: #00e676; }
        .status-error { color: #ef5350; }
        .blink { animation: blink 1s infinite; }
        @keyframes blink { 50% { opacity: 0.3; } }
        .clock { font-size: 1.4rem; font-family: monospace; }
    </style>
</head>
<body>

<div class="gate-header">
    <div>
        <span style="font-size:1.5rem;font-weight:700">🚗 SmartPark</span>
        <span class="ms-3 badge bg-success">ENTRY GATE</span>
    </div>
    <div class="clock" id="clock">--:--:--</div>
</div>

<div class="status-screen" id="status-screen">
    <!-- Default ready state -->
    <div class="text-center status-ready" id="display-ready">
        <div style="font-size:5rem" class="blink">🚦</div>
        <h1 class="mt-3" style="font-size:3rem;font-weight:700">READY</h1>
        <p style="font-size:1.5rem;opacity:0.7">Waiting for vehicle...</p>
        <p style="opacity:0.5">ANPR camera is active</p>
    </div>
</div>

<!-- Stats bar -->
<div style="background:#111;padding:12px 32px;display:flex;gap:40px;justify-content:center">
    <div class="text-center">
        <div style="color:#64b5f6;font-size:1.5rem;font-weight:700" id="s-available">—</div>
        <div style="color:#888;font-size:0.8rem">AVAILABLE</div>
    </div>
    <div class="text-center">
        <div style="color:#ef5350;font-size:1.5rem;font-weight:700" id="s-occupied">—</div>
        <div style="color:#888;font-size:0.8rem">OCCUPIED</div>
    </div>
    <div class="text-center">
        <div style="color:#ffd54f;font-size:1.5rem;font-weight:700" id="s-total">—</div>
        <div style="color:#888;font-size:0.8rem">TOTAL</div>
    </div>
</div>

<script>
// Clock
function updateClock() {
    document.getElementById('clock').textContent =
        new Date().toLocaleTimeString('en-IN');
}
setInterval(updateClock, 1000);
updateClock();

// Load stats
async function loadStats() {
    try {
        const res = await fetch('/api/slots/');
        const slots = await res.json();
        document.getElementById('s-available').textContent =
            slots.filter(s => s.status === 'available').length;
        document.getElementById('s-occupied').textContent =
            slots.filter(s => s.status === 'occupied').length;
        document.getElementById('s-total').textContent = slots.length;
    } catch(e) {}
}

// Show result on screen
function showEntry(data) {
    const screen = document.getElementById('status-screen');
    if (data.success) {
        screen.innerHTML = `
            <div class="text-center status-success">
                <div style="font-size:4rem">✅</div>
                <h1 style="font-size:2.5rem;font-weight:700;margin-top:16px">WELCOME!</h1>
                <div class="plate-display my-4">${data.plate_detected || data.vehicle || '—'}</div>
                <p style="font-size:1.5rem;opacity:0.8">Proceed to Slot</p>
                <div class="slot-display">${data.slot_id}</div>
                <p style="font-size:1.2rem;opacity:0.6">${data.zone || ''}</p>
                <div style="margin-top:24px;padding:12px 32px;background:#00e67633;border-radius:12px;border:2px solid #00e676">
                    <span style="font-size:1.5rem">🚧 BARRIER OPEN</span>
                </div>
            </div>`;
        // Reset after 8 seconds
        setTimeout(() => {
            screen.innerHTML = document.getElementById('display-ready')?.outerHTML ||
                '<div class="text-center status-ready"><div style="font-size:5rem" class="blink">🚦</div><h1 style="font-size:3rem;font-weight:700">READY</h1><p style="font-size:1.5rem;opacity:0.7">Waiting for vehicle...</p></div>';
        }, 8000);
    } else {
        screen.innerHTML = `
            <div class="text-center status-error">
                <div style="font-size:5rem">❌</div>
                <h1 style="font-size:2.5rem;font-weight:700;margin-top:16px">ENTRY DENIED</h1>
                <p style="font-size:1.5rem;margin-top:16px">${data.error || 'Please contact staff'}</p>
            </div>`;
        setTimeout(() => location.reload(), 5000);
    }
}

// Poll for latest transaction every 3 seconds
let lastTxId = 0;
async function pollLatestEntry() {
    try {
        const res = await fetch('/api/list/');
        const txs = await res.json();
        if (txs.length && txs[0].id !== lastTxId && !txs[0].exit_time) {
            lastTxId = txs[0].id;
            showEntry({
                success: true,
                slot_id: txs[0].slot,
                vehicle: txs[0].vehicle,
                zone: ''
            });
        }
    } catch(e) {}
}

loadStats();
setInterval(loadStats, 10000);
setInterval(pollLatestEntry, 3000);
</script>
</body>
</html>
