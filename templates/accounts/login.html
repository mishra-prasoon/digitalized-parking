{% extends "base.html" %}
{% block content %}
<div style="max-width:380px; margin:0 auto;">
  <h2 style="text-align:center; border:none;">🔐 Login</h2>
  <p style="text-align:center; margin-top:-8px;">Sign in to manage your parking</p>
  {% if form.errors %}
    <p style="color:var(--red); background:#fef2f2; padding:10px 14px; border-radius:8px; font-size:14px;">
      Invalid username or password. Please try again.
    </p>
  {% endif %}
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" style="width:100%;">Login</button>
  </form>
  <p style="text-align:center; margin-top:18px;">Don't have an account? <a href="{% url 'register' %}">Register here</a></p>
</div>
{% endblock %}
