<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}ParkEase{% endblock %}</title>
<style>
  :root {
    --primary: #2563eb;
    --primary-dark: #1d4ed8;
    --bg: #f4f6fb;
    --card: #ffffff;
    --text: #1f2937;
    --muted: #6b7280;
    --border: #e5e7eb;
    --green: #16a34a;
    --red: #dc2626;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header.topbar {
    background: linear-gradient(90deg, var(--primary), var(--primary-dark));
    color: white;
    padding: 18px 32px;
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 0.5px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
  }
  .container {
    max-width: 960px;
    margin: 32px auto;
    background: var(--card);
    padding: 32px 40px;
    border-radius: 12px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.06);
  }
  h2 {
    margin-top: 0;
    font-size: 24px;
    color: var(--text);
    border-bottom: 2px solid var(--border);
    padding-bottom: 12px;
  }
  h3 {
    color: var(--text);
    margin-top: 28px;
  }
  a {
    color: var(--primary);
    text-decoration: none;
    font-weight: 500;
  }
  a:hover { text-decoration: underline; }
  p { line-height: 1.6; color: var(--muted); }
  form p { margin: 14px 0; }
  input[type="text"], input[type="email"], input[type="password"],
  input[type="file"], input[type="datetime-local"], select {
    width: 100%;
    max-width: 360px;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 14px;
    margin-top: 4px;
  }
  input:focus, select:focus { outline: none; border-color: var(--primary); }
  label { font-weight: 600; font-size: 14px; color: var(--text); }
  button, input[type="submit"] {
    background: var(--primary);
    color: white;
    border: none;
    padding: 10px 20px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 8px;
    transition: background 0.15s ease;
  }
  button:hover { background: var(--primary-dark); }
  table {
    border-collapse: collapse;
    width: 100%;
    margin: 16px 0;
    font-size: 14px;
  }
  table, th, td { border: 1px solid var(--border) !important; }
  th, td { padding: 10px 14px !important; text-align: left; }
  th { background: #eef2ff; font-weight: 600; }
  tr:nth-child(even) { background: #fafbfe; }
  video, canvas { border-radius: 10px; }
  .topnav-links { margin: 16px 0; font-size: 15px; }
  .topnav-links a { margin-right: 16px; }
  ul { padding-left: 20px; color: var(--muted); }
</style>
</head>
<body>
  <header class="topbar">🅿️ ParkEase \u2014 Digitalized Parking System</header>
  <div class="container">
    {% block content %}{% endblock %}
  </div>
</body>
</html>
